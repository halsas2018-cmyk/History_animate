name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      run_directory:
        description: 'Path to the run directory containing Pipeline output (e.g., output/run_20261009_072307)'
        required: true
        type: string
      composition:
        description: 'Composition to render (auto: auto-detect from run metadata, LongComp: 16:9 landscape, ShortComp: 9:16 vertical, MyComp: default alias)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - LongComp
          - ShortComp
          - MyComp

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate run directory input
        run: |
          RUN_DIRECTORY="${{ github.event.inputs.run_directory }}"
          echo "Checking run directory: $RUN_DIRECTORY"
          if [ ! -d "$RUN_DIRECTORY" ]; then
            echo "Error: Directory '$RUN_DIRECTORY' does not exist."
            exit 1
          fi
          # Check for required Pipeline files
          REQUIRED_FILES=("story_generation.json" "sentence_timing.json" "visual_planning.json" "visual_timing.json" "asset_preparation.json" "narration.mp3")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$RUN_DIRECTORY/$file" ]; then
              echo "Error: Required file '$file' not found in '$RUN_DIRECTORY'."
              exit 1
            fi
          done
          echo "Run directory validation passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline 2
        run: |
          python3 run_pipeline2.py "${{ github.event.inputs.run_directory }}"

      - name: Copy whiteboard scenes to Remotion public directory
        run: |
          mkdir -p my-video/public
          cp -v "$RUN_DIRECTORY"/whiteboard/scene\ *.mp4 my-video/public/ 2>/dev/null || echo "No scene files found to copy (this may be OK if scenes are generated elsewhere)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-video/package-lock.json

      - name: Install Remotion dependencies
        run: npm ci
        working-directory: my-video

      - name: Determine Remotion Composition
        id: select-comp
        run: |
          INPUT_COMP="${{ github.event.inputs.composition }}"
          RUN_DIRECTORY="${{ github.event.inputs.run_directory }}"

          if [ "$INPUT_COMP" != "auto" ] && [ -n "$INPUT_COMP" ]; then
            SELECTED_COMP="$INPUT_COMP"
          else
            # Auto-detect length_mode from run directory metadata
            DETECTED_MODE=$(python3 -c "
          import json, sys
          run_dir = sys.argv[1]
          mode = 'short'
          for fname in ['story_generation.json', 'visual_planning.json']:
              p = f'{run_dir}/{fname}'
              try:
                  with open(p, encoding='utf-8') as f:
                      d = json.load(f)
                      m = d.get('meta', {}).get('length_mode')
                      if m in ('short', 'long'):
                          mode = m
                          break
              except Exception:
                  pass
          print(mode)
          " "$RUN_DIRECTORY")

            if [ "$DETECTED_MODE" = "long" ]; then
              SELECTED_COMP="LongComp"
            else
              SELECTED_COMP="ShortComp"
            fi
          fi

          echo "Selected Remotion composition: $SELECTED_COMP"
          echo "composition=$SELECTED_COMP" >> "$GITHUB_OUTPUT"

      - name: Render video with Remotion
        run: npx remotion render "${{ steps.select-comp.outputs.composition }}" out.mp4
        working-directory: my-video

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video-${{ steps.select-comp.outputs.composition }}
          path: my-video/out.mp4

      - name: Upload whiteboard scenes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-scenes
          path: my-video/public/scene\ *.mp4
